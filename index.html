<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abasto Paso a Paso - Sincronizado</title>
    <meta name="theme-color" content="#e91e63">

    <!-- SDKs de Firebase (vía CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121214; color: #ffffff; padding: 12px; }
        
        .estado-conexion {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .header-card {
            background-color: #1e1e24;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto 15px auto;
            border: 1px solid #2a2a32;
        }
        .header-card h1 { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .tasa-badge {
            background-color: #e91e63;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
        }
        .btn-toggle-vista {
            border: 1px solid #e91e63;
            color: #e91e63;
            background: rgba(233, 30, 99, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 12px;
            width: 100%;
            display: block;
        }

        .search-container { max-width: 900px; margin: 0 auto 15px auto; }
        .search-box {
            width: 100%;
            background-color: #1e1e24;
            border: 2px solid #2a2a32;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .categoria-section {
            max-width: 900px;
            margin: 0 auto 10px auto;
            background-color: #1e1e24;
            border-radius: 10px;
            padding: 12px 15px;
        }

        /* 📁 CABECERA DE CARPETA INTERACTIVA (CATÁLOGO) */
        .categoria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e91e63;
            font-weight: bold;
            font-size: 17px;
            padding-left: 8px;
            border-left: 4px solid #e91e63;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s ease;
        }
        .categoria-header:active { opacity: 0.6; }

        /* ✨ ANIMACIÓN FLUIDA DE DESPLIEGUE (ACORDEÓN) */
        .cat-content-wrapper {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
            opacity: 1;
        }
        .cat-content-wrapper.colapsado {
            grid-template-rows: 0fr;
            opacity: 0;
        }
        .cat-content-inner {
            overflow: hidden;
        }

        /* 🔄 FLECHA ANIMADA */
        .flecha-icon {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 11px;
            margin-right: 6px;
            color: #fbc02d;
        }
        .flecha-icon.rotado {
            transform: rotate(-90deg);
        }

        /* 📱 LISTA DE PRODUCTOS */
        .grid-productos {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        /* TARJETA MINIMALISTA */
        .card-producto {
            background-color: #26262e;
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .prod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .prod-nombre { font-size: 14px; font-weight: bold; color: #ffffff; line-height: 1.2; }
        .prod-stock { color: #4caf50; font-size: 11px; background-color: #1b5e20; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .precio-bs { color: #fbc02d; font-size: 15px; font-weight: bold; }
        .precio-ref { color: #aaa; font-size: 12px; }

        .titulo-admin { text-align: center; font-size: 20px; color: #e91e63; margin-bottom: 15px; }
        .row-paneles { display: flex; flex-wrap: wrap; gap: 15px; max-width: 900px; margin: 0 auto 20px auto; }
        .panel { background-color: #1e1e24; border-radius: 10px; padding: 18px; flex: 1; min-width: 280px; border: 1px solid #2a2a32; }
        .panel-titulo { font-size: 16px; font-weight: bold; color: #e91e63; margin-bottom: 12px; }
        label { font-size: 13px; color: #ccc; display: block; margin-top: 10px; margin-bottom: 4px; }
        input { width: 100%; background-color: #26262e; border: 1px solid #444; padding: 10px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }

        .btn-cyan { background-color: #00bcd4; color: #000; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 15px; cursor: pointer; }
        .btn-orange { background-color: #ff9800; color: #000; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 15px; cursor: pointer; }

        .seccion-inventario { max-width: 900px; margin: 0 auto; overflow-x: auto; }
        
        /* BANNER DE SECCIÓN / CATEGORÍA CON ACCIONES EN ADMIN */
        .cat-banner { 
            background-color: #1e1e24; 
            padding: 10px 12px; 
            border-radius: 6px; 
            color: #fbc02d; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cat-title-click {
            cursor: pointer;
            display: flex;
            align-items: center;
            user-select: none;
            flex: 1;
        }
        .cat-title-click:active { opacity: 0.7; }

        .btn-cat-action {
            background-color: #2a2a32;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-left: 4px;
        }
        .btn-cat-action:active { opacity: 0.7; }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; background-color: #1e1e24; font-size: 13px; min-width: 500px; }
        th { text-align: left; padding: 10px; color: #aaa; border-bottom: 1px solid #333; }
        td { padding: 8px 10px; border-bottom: 1px solid #2a2a32; }
        
        .input-inline { width: 70px; padding: 6px; display: inline-block; }
        .btn-guardar { background-color: #00bcd4; color: black; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-eliminar { background-color: #e91e63; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <div class="estado-conexion" id="estado-conexion">🌐 Sincronizado en la nube (Tiempo real)</div>

    <!-- CATÁLOGO PÚBLICO -->
    <div id="vista-catalogo">
        <div class="header-card">
            <h1 id="bodega-nombre">Abasto Paso a Paso</h1>
            <div class="tasa-badge">Dólar: <span id="bodega-tasa">0.00</span> Bs.</div>
            <button class="btn-toggle-vista" onclick="cambiarVista('admin')">⚙️ Panel de Control</button>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" id="input-search" placeholder="🔍 Buscar producto...">
        </div>

        <div id="contenedor-categorias">Cargando inventario de la nube...</div>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <div id="vista-admin" class="oculto">
        <div style="max-width: 900px; margin: 0 auto 15px auto;">
            <button class="btn-toggle-vista" style="background-color: #26262e;" onclick="cambiarVista('catalogo')">← Volver al Menú Principal</button>
        </div>

        <h1 class="titulo-admin">Control de Inventario en la Nube</h1>

        <div class="row-paneles">
            <div class="panel">
                <div class="panel-titulo">1. Cambio del Dólar</div>
                <p style="font-size: 14px;">Tasa actual: <strong style="color: #4caf50;" id="tasa-actual">0.00 Bs.</strong></p>
                <p style="font-size: 11px; color: #888; margin-top: 4px;" id="tasa-fecha">Modificado: -</p>

                <label>Nueva Tasa del Dólar (Bs):</label>
                <input type="number" step="0.01" id="input-tasa" placeholder="Ej: 675.89">
                <button class="btn-cyan" onclick="actualizarTasa()">Actualizar Tasa en Todos los Equipos</button>
            </div>

            <div class="panel">
                <div class="panel-titulo">2. Agregar Producto</div>
                <label>Nombre:</label>
                <input type="text" id="p-nombre" placeholder="Ej: Harina Pan">

                <label>Categoría:</label>
                <input type="text" id="p-categoria" placeholder="Ej: Viveres">

                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <label>Costo (Bs):</label>
                        <input type="number" step="0.01" id="p-costo" placeholder="620">
                    </div>
                    <div style="flex:1;">
                        <label>Ganancia (%):</label>
                        <input type="number" step="0.1" id="p-ganancia" placeholder="15">
                    </div>
                </div>

                <label>Stock:</label>
                <input type="number" id="p-stock" placeholder="8">

                <button class="btn-orange" onclick="registrarProducto()">Guardar Producto en la Nube</button>
            </div>
        </div>

        <div class="seccion-inventario">
            <h2 style="text-align: center; font-size: 16px; margin-bottom: 12px;">Inventario Registrado</h2>
            
            <!-- 🔍 BUSCADOR LUPA EN EL PANEL DE ADMINISTRACIÓN -->
            <div class="search-container" style="margin-bottom: 15px;">
                <input type="text" class="search-box" id="input-search-admin" placeholder="🔍 Buscar producto o carpeta en inventario...">
            </div>

            <div id="tabla-categorias"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCM11K2lCpJgbvCo3KcK6Hw1vzPk7NPpp0",
            authDomain: "abastopasoapaso-fdb2a.firebaseapp.com",
            databaseURL: "https://abastopasoapaso-fdb2a-default-rtdb.firebaseio.com",
            projectId: "abastopasoapaso-fdb2a",
            storageBucket: "abastopasoapaso-fdb2a.firebasestorage.app",
            messagingSenderId: "968132115887",
            appId: "1:968132115887:web:d3e55a675d9084c3e1835a",
            measurementId: "G-407VF4LPBP"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let config = { nombreBodega: "Abasto Paso a Paso", tasaDolar: 675.89, ultimaModificacion: "-" };
        let productos = [];

        db.ref('abasto/config').on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                config = data;
                cargarCatalogo();
                if (!document.getElementById('vista-admin').classList.contains('oculto')) {
                    cargarAdmin();
                }
            } else {
                db.ref('abasto/config').set(config);
            }
        });

        db.ref('abasto/productos').on('value', function(snapshot) {
            const data = snapshot.val();
            productos = data ? Object.values(data) : [];
            cargarCatalogo();
            if (!document.getElementById('vista-admin').classList.contains('oculto')) {
                cargarAdmin();
            }
        });

        function cambiarVista(vista) {
            const catalogo = document.getElementById('vista-catalogo');
            const admin = document.getElementById('vista-admin');

            if (vista === 'admin') {
                catalogo.classList.add('oculto');
                admin.classList.remove('oculto');
                cargarAdmin();
            } else {
                admin.classList.add('oculto');
                catalogo.classList.remove('oculto');
                cargarCatalogo();
            }
            window.scrollTo(0,0);
        }

        function cargarCatalogo(filtro) {
            if (!filtro) filtro = '';
            document.getElementById('bodega-nombre').textContent = config.nombreBodega || "Abasto Paso a Paso";
            const tasaNum = parseFloat(config.tasaDolar) || 1;
            document.getElementById('bodega-tasa').textContent = tasaNum.toFixed(2);

            const contenedor = document.getElementById('contenedor-categorias');
            contenedor.innerHTML = '';

            const categorias = {};
            productos.forEach(function(p) {
                if (p && p.nombre) {
                    const nombreTexto = String(p.nombre);
                    if (nombreTexto.toLowerCase().includes(filtro.toLowerCase())) {
                        const catNombre = p.categoria ? String(p.categoria).trim() : "Viveres";
                        if (!categorias[catNombre]) categorias[catNombre] = [];
                        categorias[catNombre].push(p);
                    }
                }
            });

            const estadoColapsado = filtro.trim() === '' ? 'colapsado' : '';
            const estadoRotado = estadoColapsado ? 'rotado' : '';

            const categoriasOrdenadas = Object.keys(categorias).sort(function(a, b) { 
                return a.localeCompare(b, 'es', { sensitivity: 'base' });
            });

            categoriasOrdenadas.forEach(function(cat) {
                let html = '<div class="categoria-section"><div class="categoria-header"><span>' + cat + '</span><span><span class="flecha-icon ' + estadoRotado + '">▼</span> 📁</span></div><div class="cat-content-wrapper ' + estadoColapsado + '"><div class="cat-content-inner"><div class="grid-productos">';

                categorias[cat].sort(function(a, b) {
                    const nomA = String(a.nombre || '');
                    const nomB = String(b.nombre || '');
                    return nomA.localeCompare(nomB, 'es', { sensitivity: 'base' });
                });

                categorias[cat].forEach(function(p) {
                    const costo = parseFloat(p.costoBs) || 0;
                    const ganancia = parseFloat(p.ganancia) || 0;
                    const precioFinalBs = costo * (1 + ganancia / 100);
                    const precioUSD = tasaNum > 0 ? (precioFinalBs / tasaNum) : 0;
                    const stockNum = p.stock !== undefined ? p.stock : 0;

                    html += '<div class="card-producto"><div class="prod-row"><span class="prod-nombre">' + p.nombre + '</span><span class="prod-stock">' + stockNum + ' und</span></div><div class="prod-row"><span class="precio-bs">' + precioFinalBs.toFixed(2) + ' Bs.</span><span class="precio-ref">Ref: $' + precioUSD.toFixed(2) + '</span></div></div>';
                });

                html += '</div></div></div></div>';
                contenedor.innerHTML += html;
            });
        }

        function cargarAdmin() {
            const tasaNum = parseFloat(config.tasaDolar) || 0;
            document.getElementById('tasa-actual').textContent = tasaNum.toFixed(2) + " Bs.";
            document.getElementById('tasa-fecha').textContent = "Modificado: " + (config.ultimaModificacion || '-');
            const filtroAdmin = document.getElementById('input-search-admin') ? document.getElementById('input-search-admin').value : '';
            renderTablasAdmin(filtroAdmin);
        }

        function actualizarTasa() {
            const nuevaTasa = parseFloat(document.getElementById('input-tasa').value);
            if (nuevaTasa) {
                const ahora = new Date();
                config.tasaDolar = nuevaTasa;
                config.ultimaModificacion = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                db.ref('abasto/config').set(config);
                document.getElementById('input-tasa').value = '';
                alert('Tasa actualizada en la nube para todos los dispositivos.');
            }
        }

        function registrarProducto() {
            const nombre = document.getElementById('p-nombre').value;
            const categoria = document.getElementById('p-categoria').value || "Viveres";
            const costo = parseFloat(document.getElementById('p-costo').value);
            const ganancia = parseFloat(document.getElementById('p-ganancia').value) || 0;
            const stock = parseInt(document.getElementById('p-stock').value) || 0;

            if (!nombre || isNaN(costo)) {
                alert('Escribe el nombre y el costo.');
                return;
            }

            const id = Date.now();
            const nuevoProd = { id: id, nombre: nombre, categoria: categoria, costoBs: costo, ganancia: ganancia, stock: stock };

            db.ref('abasto/productos/' + id).set(nuevoProd);

            document.getElementById('p-nombre').value = '';
            document.getElementById('p-costo').value = '';
            document.getElementById('p-ganancia').value = '';
            document.getElementById('p-stock').value = '';
            alert('Producto guardado en la nube.');
        }

        function renderTablasAdmin(filtro) {
            if (!filtro) filtro = '';
            const contenedor = document.getElementById('tabla-categorias');
            contenedor.innerHTML = '';

            const categorias = {};
            productos.forEach(function(p) {
                if (p && p.nombre) {
                    const nombreTexto = String(p.nombre);
                    const catTexto = p.categoria ? String(p.categoria) : 'Viveres';
                    
                    if (nombreTexto.toLowerCase().includes(filtro.toLowerCase()) || catTexto.toLowerCase().includes(filtro.toLowerCase())) {
                        const catNombre = catTexto.trim();
                        if (!categorias[catNombre]) categorias[catNombre] = [];
                        categorias[catNombre].push(p);
                    }
                }
            });

            const estadoColapsado = filtro.trim() === '' ? 'colapsado' : '';
            const estadoRotado = estadoColapsado ? 'rotado' : '';

            const categoriasOrdenadas = Object.keys(categorias).sort(function(a, b) { 
                return a.localeCompare(b, 'es', { sensitivity: 'base' });
            });

            categoriasOrdenadas.forEach(function(cat) {
                const catEscapada = cat.replace(/'/g, "\\'");
                let html = '<div class="cat-banner"><div class="cat-title-click" onclick="toggleAdminCat(this)"><span class="flecha-icon ' + estadoRotado + '">▼</span><span>📁 ' + cat + ' (' + categorias[cat].length + ')</span></div><div><button class="btn-cat-action" onclick="renombrarCategoria(\'' + catEscapada + '\')">✏️ Renombrar</button><button class="btn-cat-action" style="color: #ff5252;" onclick="eliminarCategoria(\'' + catEscapada + '\')">🗑️ Eliminar</button></div></div><div class="cat-content-wrapper ' + estadoColapsado + '"><div class="cat-content-inner"><table><thead><tr><th>Nombre</th><th>Costo</th><th>% Gan</th><th>Stock</th><th>Acción</th></tr></thead><tbody>';

                categorias[cat].sort(function(a, b) {
                    const nomA = String(a.nombre || '');
                    const nomB = String(b.nombre || '');
                    return nomA.localeCompare(nomB, 'es', { sensitivity: 'base' });
                });

                categorias[cat].forEach(function(p) {
                    const costoBs = p.costoBs !== undefined ? p.costoBs : 0;
                    const ganancia = p.ganancia !== undefined ? p.ganancia : 0;
                    const stock = p.stock !== undefined ? p.stock : 0;

                    html += '<tr><td><input type="text" style="width: 100px;" id="nom-' + p.id + '" value="' + (p.nombre || '') + '"></td><td><input type="number" class="input-inline" id="cost-' + p.id + '" value="' + costoBs + '"></td><td><input type="number" class="input-inline" id="gan-' + p.id + '" value="' + ganancia + '"></td><td><input type="number" class="input-inline" id="stk-' + p.id + '" value="' + stock + '"></td><td><button class="btn-guardar" onclick="guardarFila(' + p.id + ')">✓</button><button class="btn-eliminar" onclick="eliminarFila(' + p.id + ')">✕</button></td></tr>';
                });

                html += '</tbody></table></div></div>';
                contenedor.innerHTML += html;
            });
        }

        function toggleAdminCat(el) {
            const banner = el.closest('.cat-banner');
            const wrapper = banner.nextElementSibling;
            const icon = el.querySelector('.flecha-icon');
            if (wrapper) {
                wrapper.classList.toggle('colapsado');
            }
            if (icon) {
                icon.classList.toggle('rotado');
            }
        }

        function renombrarCategoria(nombreViejo) {
            const nuevoNombre = prompt('Ingresa el nuevo nombre para la categoría:', nombreViejo);
            if (!nuevoNombre || nuevoNombre.trim() === '' || nuevoNombre.trim() === nombreViejo) return;

            const catLimpia = nuevoNombre.trim();
            let actualizaciones = {};

            productos.forEach(function(p) {
                const currentCat = p.categoria ? String(p.categoria).trim() : "Viveres";
                if (currentCat === nombreViejo) {
                    actualizaciones['abasto/productos/' + p.id + '/categoria'] = catLimpia;
                }
            });

            if (Object.keys(actualizaciones).length > 0) {
                db.ref().update(actualizaciones);
                alert('Categoría renombrada con éxito.');
            }
        }

        function eliminarCategoria(nombreCat) {
            if (confirm('¿Seguro que deseas eliminar la categoría "' + nombreCat + '" y TODOS los productos que contiene?')) {
                let actualizaciones = {};

                productos.forEach(function(p) {
                    const currentCat = p.categoria ? String(p.categoria).trim() : "Viveres";
                    if (currentCat === nombreCat) {
                        actualizaciones['abasto/productos/' + p.id] = null;
                    }
                });

                if (Object.keys(actualizaciones).length > 0) {
                    db.ref().update(actualizaciones);
                    alert('Categoría y productos eliminados.');
                }
            }
        }

        function guardarFila(id) {
            const prodExistente = productos.find(function(p) { return String(p.id) === String(id); });
            const cat = prodExistente ? prodExistente.categoria : "Viveres";

            const prodActualizado = {
                id: id,
                nombre: document.getElementById('nom-' + id).value,
                costoBs: parseFloat(document.getElementById('cost-' + id).value) || 0,
                ganancia: parseFloat(document.getElementById('gan-' + id).value) || 0,
                stock: parseInt(document.getElementById('stk-' + id).value) || 0,
                categoria: cat
            };

            db.ref('abasto/productos/' + id).set(prodActualizado);
            alert('Producto actualizado.');
        }

        function eliminarFila(id) {
            if (confirm('¿Eliminar producto?')) {
                db.ref('abasto/productos/' + id).remove();
            }
        }

        document.getElementById('input-search').addEventListener('input', function(e) {
            cargarCatalogo(e.target.value);
        });

        document.getElementById('input-search-admin').addEventListener('input', function(e) {
            renderTablasAdmin(e.target.value);
        });

        document.addEventListener('click', function (e) {
            const header = e.target.closest('.categoria-header');
            if (header) {
                const wrapper = header.nextElementSibling;
                const icon = header.querySelector('.flecha-icon');
                if (wrapper) {
                    wrapper.classList.toggle('colapsado');
                }
                if (icon) {
                    icon.classList.toggle('rotado');
                }
            }
        });
    </script>
</body>
</html>
